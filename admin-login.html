<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Abraham Joseph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000; --ink-2:#0c0c0c; --text:#f5f5f2; --text-dim:#8f8f8a;
    --mustard:#d9a441; --burnt:#d9a441; --accent:#d9a441; --olive:#2a2a28; --line:#212120;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:#080808; color:var(--text); font-family:'Space Grotesk', sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; }
  .mono{ font-family:'Space Mono', monospace; }
  .card{
    width:min(1120px,100%); min-height:650px; display:grid; grid-template-columns:1.05fr 0.95fr; overflow:hidden;
    background:#050505; border:1px solid #292929; border-radius:30px; box-shadow:0 36px 90px -38px rgba(0,0,0,.9);
  }
  .login-art{ position:relative; overflow:hidden; padding:42px; display:flex; flex-direction:column; justify-content:space-between; isolation:isolate; background:linear-gradient(155deg,#102638 0%,#18142f 42%,#231126 100%); }
  .login-art::before{ content:''; position:absolute; z-index:-1; inset:-18%; background:radial-gradient(ellipse at 72% 8%,rgba(217,164,65,.92) 0 2%,transparent 21%),linear-gradient(122deg,transparent 35%,rgba(65,120,217,.76) 43%,rgba(178,78,169,.62) 49%,rgba(217,164,65,.8) 54%,transparent 63%),radial-gradient(ellipse at 12% 90%,rgba(59,119,202,.48),transparent 44%); transform:rotate(-9deg); filter:blur(7px); }
  .login-art::after{ content:''; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.54)); }
  .art-mark{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:#060606; color:var(--accent); font-family:'Space Mono',monospace; font-weight:700; }
  .art-copy{ max-width:410px; font-size:clamp(34px,4vw,54px); font-weight:300; line-height:1.06; letter-spacing:-.035em; }
  .art-copy strong{ font-weight:700; }
  .login-pane{ display:flex; align-items:center; justify-content:center; padding:54px; }
  .login-form-wrap{ width:min(100%,350px); }
  .eyebrow{ font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
  h1{ font-size:34px; font-weight:600; letter-spacing:-0.03em; margin-bottom:8px; }
  .sub{ color:var(--text-dim); font-size:15px; margin-bottom:34px; }
  label{ display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px; }
  .field{ margin-bottom:18px; }
  input{
    width:100%; padding:14px 15px; background:#1b1b1b; border:1px solid #1b1b1b; border-radius:9px;
    color:var(--text); font-family:'Space Grotesk', sans-serif; font-size:15px; transition:border-color .2s,background .2s;
  }
  input:focus{ outline:none; border-color:var(--accent); background:#202020; }
  input[readonly]{ color:#a8a8a3; cursor:default; }
  button{
    width:100%; padding:15px; margin-top:8px; background:var(--accent); color:var(--ink); border:none;
    border-radius:9px; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; cursor:pointer; transition:background .2s,transform .2s;
  }
  button:hover{ background:#e8b452; transform:translateY(-1px); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .msg{ margin-top:16px; font-size:13px; font-family:'Space Mono', monospace; min-height:18px; }
  .msg.error{ color:#e2795a; }
  .msg.ok{ color:#7fbf7f; }
  .back{ display:block; margin-top:22px; text-align:center; font-size:13px; color:var(--text-dim); text-decoration:none; }
  .back:hover{ color:var(--accent); }
  .config-warn{
    margin-top:24px; padding:12px 14px; border:1px solid var(--burnt); border-radius:9px;
    font-family:'Space Mono', monospace; font-size:11.5px; color:#e2a07a; line-height:1.6; display:none;
  }
  @media (max-width:760px){ body{ padding:14px; } .card{ grid-template-columns:1fr; min-height:auto; border-radius:22px; } .login-art{ min-height:230px; padding:28px; } .art-copy{ font-size:34px; } .login-pane{ padding:38px 24px; } }
</style>
</head>
<body>
  <div class="card">
    <aside class="login-art" aria-hidden="true">
      <div class="art-mark">AJ</div>
      <div class="art-copy">It’s Not For You, <strong>It’s For Me.</strong></div>
    </aside>
    <main class="login-pane">
      <div class="login-form-wrap">
        <div class="eyebrow">Restricted access</div>
        <h1>Welcome back.</h1>
        <p class="sub">Sign in to manage your site content.</p>

        <form id="loginForm">
          <div class="field">
            <label for="adminEmail">Email</label>
            <input id="adminEmail" type="email" value="abrahamjosephxd@gmail.com" autocomplete="username" readonly>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" id="submitBtn">Log in</button>
          <div class="msg" id="msg"></div>
        </form>

        <a class="back" href="#" id="forgotLink">Forgot password?</a>

        <div class="config-warn" id="configWarn">
          Supabase isn't configured yet — set SUPABASE_URL and SUPABASE_ANON_KEY in this file's script tag before logging in. See README.md.
        </div>

        <a class="back" href="index.html">← Back to site</a>
      </div>
    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://lnihafgnujxdcmhwjrhc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuaWhhZmdudWp4ZGNtaHdqcmhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MjAzMDEsImV4cCI6MjEwMDA5NjMwMX0.TSYxT_C-mDZ6n-WGIzoHDsCzxss_XIx0_SFiwbWxkUo";
  const ADMIN_EMAIL = "abrahamjosephxd@gmail.com"; // single-admin site — email is fixed, only password is asked

  const notConfigured = SUPABASE_URL.indexOf("YOUR_SUPABASE") === 0;
  if (notConfigured) {
    document.getElementById('configWarn').style.display = 'block';
    document.getElementById('submitBtn').disabled = true;
  }

  const client = notConfigured ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // If already logged in, go straight to dashboard.
  (async function checkSession(){
    if (!client) return;
    const { data } = await client.auth.getSession();
    if (data.session) window.location.href = 'admin-dashboard.html';
  })();

  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    if (!client) return;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    msg.textContent = ''; msg.className = 'msg';
    btn.disabled = true; btn.textContent = 'Logging in…';

    const password = document.getElementById('password').value;

    const { error } = await client.auth.signInWithPassword({ email: ADMIN_EMAIL, password });

    btn.disabled = false; btn.textContent = 'Log In';

    if (error) {
      msg.textContent = error.message;
      msg.className = 'msg error';
      return;
    }
    msg.textContent = 'Success — redirecting…';
    msg.className = 'msg ok';
    window.location.href = 'admin-dashboard.html';
  });

  document.getElementById('forgotLink').addEventListener('click', async function(e){
    e.preventDefault();
    if (!client) return;
    const msg = document.getElementById('msg');
    const resetUrl = window.location.href.replace('admin-login.html', 'reset-password.html');
    const { error } = await client.auth.resetPasswordForEmail(ADMIN_EMAIL, { redirectTo: resetUrl });
    if (error) {
      msg.textContent = error.message;
      msg.className = 'msg error';
      return;
    }
    msg.textContent = 'Reset link sent — check your email.';
    msg.className = 'msg ok';
  });
</script>
</body>
</html>
